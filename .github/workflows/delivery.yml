name: Portfolio delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate site
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evanmhenry-com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: evanmhenry-com/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Check production analytics configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node -e "if (!/^G-[A-Z0-9]+$/.test(process.env.GA_ID ?? '')) throw new Error('Configure the GA_MEASUREMENT_ID Actions variable before production delivery')"
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GA_MEASUREMENT_ID || '' }}
      - run: npm run test:export
      - name: Record artifact provenance
        run: node ../scripts/write-deployment.mjs
        env:
          SITE_COMMIT: ${{ github.sha }}
          SITE_RUN_ID: ${{ github.run_id }}
      - name: Preserve the tested static export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-site
          path: evanmhenry-com/out/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://evanmhenry.com
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-site
          path: site
      - name: Deploy the tested artifact
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
          production_branch: main
          is_static_export: true
      - name: Verify production
        run: node scripts/verify-deployment.mjs
        env:
          SITE_URL: https://evanmhenry.com
          EXPECTED_COMMIT: ${{ github.sha }}

  release:
    name: Record release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="deploy-${RUN_ID}-${ATTEMPT}"
          gh release create "$tag" --target "$COMMIT" --title "Deploy ${COMMIT:0:7}" --generate-notes --notes "Production: https://evanmhenry.com · tested artifact: https://github.com/${GH_REPO}/actions/runs/${RUN_ID} (90-day retention)."
