name: Portfolio delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate site
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evanmhenry-com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: evanmhenry-com/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Check production analytics configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node -e "if (!/^G-[A-Z0-9]+$/.test(process.env.GA_ID ?? '')) console.log('::warning::GA_MEASUREMENT_ID is missing or invalid; analytics will remain disabled')"
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GA_MEASUREMENT_ID || '' }}
      - run: npm run test:export
      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: evanmhenry-com/out
          skip_app_build: true
          skip_api_build: true
          production_branch: main
          is_static_export: true
      - name: Check homepage responds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: curl --fail --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 20 --output /dev/null https://evanmhenry.com/
