name: Deploy portfolio to Azure Static Web Apps

on:
  push:
    branches: [main, feat/version-2]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    name: Build and deploy
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evanmhenry-com/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: evanmhenry-com

      - name: Check analytics safeguards
        run: node --experimental-strip-types --test tests/analytics.test.mjs
        working-directory: evanmhenry-com

      - name: Build static site
        run: npm run build
        working-directory: evanmhenry-com
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ github.ref == 'refs/heads/main' && vars.GA_MEASUREMENT_ID || '' }}

      - name: Deploy static export
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: evanmhenry-com/out
          skip_app_build: true
          production_branch: main
          deployment_environment: ${{ github.ref == 'refs/heads/feat/version-2' && 'version-2' || '' }}
          is_static_export: true

  close_pull_request_job:
    name: Close pull request preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Close pull request preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
