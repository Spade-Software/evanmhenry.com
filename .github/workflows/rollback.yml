name: Roll back production

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Portfolio delivery run ID on main (artifact retained for 90 days)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    name: Restore tested artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://evanmhenry.com
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: node scripts/check-rollback-run.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-site
          path: site
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check artifact provenance
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: node scripts/check-artifact.mjs
      - name: Restore production
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
          production_branch: main
          is_static_export: true
      - name: Verify restored site
        env:
          SITE_URL: https://evanmhenry.com
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: node scripts/verify-deployment.mjs
